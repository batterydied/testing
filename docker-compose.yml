services:
  flask:
    build: 
      context: ./server
    ports:
      - "5000:5000"

  jenkins:
    build:
      context: ./Jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: